[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpsrg-vector-vllm"
version = "0.1.0"
description = "Single-GPU, request-isolated vector steering for FPSRG catalogs"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
gpu = ["torch==2.10.0", "vllm==0.19.0", "safetensors>=0.8,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
fpsrg-vector-serve = "fpsrg_vector_vllm.server:main"
fpsrg-vector-inspect = "fpsrg_vector_vllm.artifact:main"

[tool.setuptools.packages.find]
where = ["src"]
